name: CI

# Verdict in five minutes at most, from the first job started to the last
# finished (hard project rule). One job: types, lint, tests, build, project
# guards, then the self-tests of the CI guards themselves.
#
# The check published by this workflow is named `ci` (a job names its check):
# it is required by the `main` ruleset and by the Mergify queue, together with
# `ci-budget` and `couche0`.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: [self-hosted, linux, x64, packet-voyage-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Clean workspace
        shell: bash
        run: git clean -ffdx

      - name: Toolchain
        shell: bash
        run: source .github/ci/toolchain.sh

      - name: Install
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          pnpm install --frozen-lockfile --prefer-offline --store-dir "$HOME/tools/pnpm-store"

      - name: Types
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          pnpm typecheck

      - name: Lint
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          pnpm lint

      - name: Tests
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          pnpm test

      - name: Build
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          pnpm build

      - name: Project guards
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          node scripts/guards/run-all.mjs

      - name: Guard self-tests
        shell: bash
        run: |
          python3 .github/couche0/test_check_couche0.py
          python3 .github/fireworks/test_conflict_agent.py
          python3 .github/fireworks/test_test_agent.py
          python3 .github/fireworks/test_scope_agent.py
          python3 .github/fireworks/test_union_journal.py
          python3 .github/fireworks/test_quota.py
