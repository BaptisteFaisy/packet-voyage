name: CI

# Verdict in five minutes at most, per job, from the first step started to the
# last finished (hard project rule, guarded by ci-budget).
#
# Two jobs run in PARALLEL on the self-hosted fleet, because the five-minute
# budget is per job and a single job was at the mercy of a busy machine: the
# code verdict (types, tests, build) and the rule verdict (lint, project guards,
# guard self-tests) each get their own budget and their own runner.
#
# Both checks are required by the `main` ruleset and by the Mergify queue,
# together with `ci-budget` and `couche0`.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: [self-hosted, linux, x64, packet-voyage-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Clean workspace
        shell: bash
        run: git clean -ffdx

      - name: Toolchain
        shell: bash
        run: source .github/ci/toolchain.sh

      - name: Install
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          pnpm install --frozen-lockfile --prefer-offline --store-dir "$HOME/tools/pnpm-store"

      - name: Types
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          pnpm typecheck

      - name: Tests
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          pnpm test

      - name: Build
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          pnpm build

  ci-quality:
    name: ci-quality
    runs-on: [self-hosted, linux, x64, packet-voyage-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Clean workspace
        shell: bash
        run: git clean -ffdx

      - name: Toolchain
        shell: bash
        run: source .github/ci/toolchain.sh

      - name: Install
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          pnpm install --frozen-lockfile --prefer-offline --store-dir "$HOME/tools/pnpm-store"

      - name: Lint
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          pnpm lint

      # Contest compliance and the project's own rules: vocabulary, data
      # licences, fixture privacy, size limits, no-network, .kiro tracked,
      # roadmap parity, bundle size.
      - name: Project guards
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          node scripts/guards/run-all.mjs

      - name: Guard self-tests
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          node scripts/guards/selftest.mjs
          python3 .github/couche0/test_check_couche0.py
          python3 .github/fireworks/test_conflict_agent.py
          python3 .github/fireworks/test_test_agent.py
          python3 .github/fireworks/test_scope_agent.py
          python3 .github/fireworks/test_union_journal.py
          python3 .github/fireworks/test_quota.py
